name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check package.toml and scripts
        run: |
          python - <<'PY'
          import tomllib, pathlib, py_compile, sys, json

          root = pathlib.Path(".")
          pkg = tomllib.loads((root / "package.toml").read_text(encoding="utf-8"))["package"]

          for key in ("name", "version", "summary", "author"):
              if key not in pkg:
                  sys.exit(f"package.toml missing `{key}`")

          scripts = sorted((root / "scripts").glob("*.py"))
          if not scripts:
              sys.exit("scripts/ is empty")

          tools = []
          for s in scripts:
              src = s.read_text(encoding="utf-8")
              if not src.startswith("#!"):
                  sys.exit(f"{s.name}: missing shebang")
              if "# Parameters:" not in src:
                  sys.exit(f"{s.name}: missing Parameters block")
              py_compile.compile(str(s), doraise=True)
              tools.append(s.stem)

          print(json.dumps({
              "id": root.name,
              "version": pkg["version"],
              "tools": tools,
          }, ensure_ascii=False, indent=1))
          PY

  release:
    name: Pack and publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack .miyu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd

          ID=$(basename "$PWD")
          VER=$(python3 -c "import tomllib;print(tomllib.load(open('package.toml','rb'))['package']['version'])")
          TAG=${GITHUB_REF_NAME#v}

          if [ "$VER" != "$TAG" ]; then
            echo "tag v$TAG does not match package.toml version $VER"
            exit 1
          fi

          tar --exclude="$ID/.git" -cf - -C .. "$ID" | zstd -19 -T0 -q -f -o "$ID-$VER.miyu"
          test -s "$ID-$VER.miyu"
          sha256sum "$ID-$VER.miyu" | tee "$ID-$VER.miyu.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID=$(basename "$PWD")
          VER=$(python3 -c "import tomllib;print(tomllib.load(open('package.toml','rb'))['package']['version'])")

          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "$ID-$VER.miyu" "$ID-$VER.miyu.sha256" --clobber
          else
            gh release create "v$VER" "$ID-$VER.miyu" "$ID-$VER.miyu.sha256" \
              --title "$ID $VER" --generate-notes
          fi
